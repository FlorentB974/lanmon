services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lanmon-backend
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/lanmon.db
      - SCAN_INTERVAL=300
      # Optional read-only DHCP enrichment. Mount a dnsmasq lease file or a
      # normalized JSON export and uncomment both lines.
      # - DHCP_LEASE_FILE=/app/leases/dhcp.leases
      # - DHCP_LEASE_FORMAT=auto
    volumes:
      - ./data:/app/data
      # Let avahi-browse use the host Avahi daemon's live mDNS cache/browse.
      # The backend still falls back to direct Zeroconf when this socket is
      # unavailable.
      - /run/avahi-daemon/socket:/run/avahi-daemon/socket:ro
      # - /path/on/host/dhcp.leases:/app/leases/dhcp.leases:ro
    # Network scanning requires special privileges
    # NOTE: On macOS/Windows, Docker runs in a VM so network scanning won't work.
    # For full LAN scanning on macOS/Windows, run the backend natively.
    # On Linux, uncomment the next line for host network access:
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://192.168.1.14:8250
    container_name: lanmon-frontend
    ports:
      - "3250:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://192.168.1.14:8250
    depends_on:
      - backend
    restart: unless-stopped
